<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 180 960 440" role="img" aria-labelledby="title desc">
  <title id="title">三间暂存屋</title>
  <desc id="desc">A屋是圆窗和一颗星，B屋是方窗和两颗星，C屋是圆窗和两颗星。此图为虚构纸面道具，需与成人便条和儿童搬运标签一起使用。</desc>
  <defs>
    <polygon id="star" points="0,-18 5,-6 18,-6 8,3 11,17 0,9 -11,17 -8,3 -18,-6 -5,-6" fill="#234b60"/>
    <g id="house">
      <path d="M0 85 L110 0 L220 85" fill="#e0eced" stroke="#234b60" stroke-width="5" stroke-linejoin="round"/>
      <rect x="16" y="85" width="188" height="215" fill="#fff" stroke="#234b60" stroke-width="5"/>
      <rect x="64" y="198" width="92" height="102" rx="5" fill="#f5f0df" stroke="#234b60" stroke-width="4"/>
    </g>
  </defs>
  <rect width="960" height="620" fill="#fffdf7"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#234b60">
    <text x="40" y="231" font-size="24" font-weight="bold">灯暂存在哪间小屋？</text>
    <g transform="translate(60 257)">
      <use href="#house"/>
      <circle cx="110" cy="141" r="29" fill="#e0eced" stroke="#234b60" stroke-width="4"/>
      <use href="#star" x="110" y="244"/>
    </g>
    <g transform="translate(370 257)">
      <use href="#house"/>
      <rect x="81" y="112" width="58" height="58" fill="#e0eced" stroke="#234b60" stroke-width="4"/>
      <use href="#star" x="89" y="244"/>
      <use href="#star" x="131" y="244"/>
    </g>
    <g transform="translate(680 257)">
      <use href="#house"/>
      <circle cx="110" cy="141" r="29" fill="#e0eced" stroke="#234b60" stroke-width="4"/>
      <use href="#star" x="89" y="244"/>
      <use href="#star" x="131" y="244"/>
    </g>
    <text x="170" y="593" text-anchor="middle" font-size="28" font-weight="bold">A</text>
    <text x="480" y="593" text-anchor="middle" font-size="28" font-weight="bold">B</text>
    <text x="790" y="593" text-anchor="middle" font-size="28" font-weight="bold">C</text>
  </g>
</svg>
